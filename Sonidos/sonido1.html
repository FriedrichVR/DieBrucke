<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antara Sikus</title>
    <style>

        body{
            background-color: rgb(209, 209, 209);
        }
        
        .card-instrumento {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;

            /* Grosor | Estilo | Color */
            border: 2px solid #353535;

            /* Opcionales recomendados para tarjetas */
            padding: 20px;          /* Espacio interno entre el borde y los elementos */
            border-radius: 10px;    /* Redondea las esquinas del borde */
            width: fit-content; /* Ajusta el ancho al contenido interno */
        }

        .card-instrumento img {
            max-width: 200px;
            height: auto;
        }

        h1{
            color: rgb(20, 20, 20);
            font-family: "Times New Roman", Times, serif;

        }


    </style>
</head>
<body>
    <h1>Antara Sikus</h1>

    <div class="card-instrumento">
        <img src="images/Antara-Sikus.webp" alt="Antara Sikus">
        
        <audio controls>
            <source src="/Sonidos/Antara-Sikus.mp3" type="audio/mpeg">
            Tu navegador no soporta el elemento de audio.
        </audio>
    </div>
</body>
</html>
