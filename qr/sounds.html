        body{

        .card-instrumento {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;

            /* Grosor | Estilo | Color */
            border: 2px solid #353535;

            /* Opcionales recomendados para tarjetas */
            padding: 20px;          /* Espacio interno entre el borde y los elementos */
            border-radius: 10px;    /* Redondea las esquinas del borde */
            width: fit-content; /* Ajusta el ancho al contenido interno */

            align-items: center; /* <- Cambia flex-start por center */
        }

        .card-instrumento img {
            max-width: 275px;
            height: auto;
        }

        h1{
            color: rgb(20, 20, 20);
            font-family: "Times New Roman", Times, serif;
            border: 2px solid #353535;
            border-radius: 10px; 
            width: fit-content;
            padding: 10px; 
            background-color: hsl(0, 3%, 60%);

        }

        .contenedor-cards {
            display: flex;
            flex-wrap: wrap;        /* Permite que bajen a la siguiente fila */
            gap: 20px;              /* Espacio entre cada card */
            justify-content:left; /* Centra las tarjetas horizontalmente */
